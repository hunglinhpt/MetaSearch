[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metasearch-api"
version = "2.6.0"
description = "MetaSearch AI — thin orchestration layer on top of SearXNG + crawl4ai/trafilatura (giants-first)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "MetaSearch" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "trafilatura>=1.12",
    "defusedxml>=0.7",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# TLS_TRUST_STORE=system: use the OS trust store (corporate proxies, antivirus TLS).
tls = ["truststore>=0.9"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "mypy>=1.11",
    "pytest-cov>=5.0",
]
# Optional: real token counting for the answer context budget
# (CONTEXT_TOKENIZER=tiktoken). Falls back to word counting without it.
tokens = ["tiktoken>=0.7"]
# Optional: MCP server (docs/07) — `python -m app.mcp` after install.
mcp = ["mcp>=1.2,<2"]  # 2.x renamed FastMCP to MCPServer; app/mcp/server.py uses the 1.x API
# Optional: OpenTelemetry tracing (OTEL_ENABLED=true + OTEL_* env vars).
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25",
]

[project.scripts]
metasearch = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"app/orchestration/scheduler.py" = ["E501"]
"app/retrieval/domain_intelligence.py" = ["E501", "RUF001"]
# Vietnamese UI labels keep their typographic en dash on purpose.
"app/tts/briefing.py" = ["RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]

[tool.mypy]
# Typed surface checked in CI (WP-16); widen the list as modules are cleaned up.
python_version = "3.12"
files = ["app/core", "app/api"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["app"]
branch = false
