# SearXNG settings — MetaSearch (mount vào /etc/searxng/settings.yml)
# Nguyên tắc: dùng default settings của SearXNG, chỉ override phần cần thiết.
# Bắt buộc: formats gồm "json" để biến SearXNG thành Unified Search API (docs/02 §2).

use_default_settings: true

server:
  secret_key: "${SEARXNG_SECRET}"
  base_url: "${SEARXNG_BASE_URL}"
  limiter: false        # nội bộ, không public — limiter off (docs/08 §1)
  image_proxy: false
  public_instance: false

outgoing:
  request_timeout: 3.0
  max_request_timeout: 4.0
  useragent_suffix: ""  # Giữ user-agent tự nhiên, không gắn hậu tố bot tránh captcha

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"   # v2.4.0 global: tự nhận ngôn ngữ query (VI/EN/…), client có thể override bằng param language
  formats:
    - html
    - json

# Danh sách engine cân bằng: kết hợp nhiều nguồn độc lập để chống phụ thuộc vào 1 engine duy nhất
# (tránh Google bot-block và CAPTCHA).
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: qwant
    disabled: false     # Dự phòng châu Âu, không dính Google captcha
  - name: startpage
    disabled: false     # Kết quả Google không CAPTCHA
  - name: wikipedia
    disabled: false
  - name: google news
    disabled: false
  - name: google scholar
    disabled: false
  - name: mojeek
    disabled: true
  - name: marginalia
    disabled: true
  # ── v2.4.0 Global Deep Search (docs/19): bật thêm các engine toàn cầu ──
  # Mạng xã hội / diễn đàn / code (một số nền tảng có thể block bot — searxng tự
  # bỏ qua engine lỗi, breaker của MetaSearch không bị ảnh hưởng):
  - name: reddit
    disabled: false
  - name: stackexchange
    disabled: false
  - name: github
    disabled: false
  - name: youtube
    disabled: false
  - name: mastodon
    disabled: false
  - name: twitter
    disabled: false
  - name: linkedin
    disabled: false
  # Học thuật / tạp chí (phục vụ "tạp chí quỹ", nghiên cứu toàn cầu):
  - name: arxiv
    disabled: false
  - name: pubmed
    disabled: false
  - name: crossref
    disabled: false
  - name: dblp
    disabled: false
  - name: semantic scholar
    disabled: false
  - name: wikidata
    disabled: false
  # Tham khảo giải trí/đời sống (mở rộng phạm vi "mọi thông tin"):
  - name: goodreads
    disabled: false
  - name: imdb
    disabled: false
  - name: openverse
    disabled: false
