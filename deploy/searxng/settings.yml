# SearXNG settings — MetaSearch (mount vào /etc/searxng/settings.yml)
# Nguyên tắc: dùng default settings của SearXNG, chỉ override phần cần thiết.
# Bắt buộc: formats gồm "json" để biến SearXNG thành Unified Search API (docs/02 §2).

use_default_settings: true

server:
  secret_key: "${SEARXNG_SECRET}"
  base_url: "${SEARXNG_BASE_URL}"
  limiter: false        # nội bộ, không public — limiter off (docs/08 §1)
  image_proxy: false
  public_instance: false

outgoing:
  request_timeout: 3.0
  max_request_timeout: 4.0
  useragent_suffix: ""  # Giữ user-agent tự nhiên, không gắn hậu tố bot tránh captcha

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "vi"
  formats:
    - html
    - json

# Danh sách engine cân bằng: kết hợp nhiều nguồn độc lập để chống phụ thuộc vào 1 engine duy nhất
# (tránh Google bot-block và CAPTCHA).
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: qwant
    disabled: false     # Dự phòng châu Âu, không dính Google captcha
  - name: startpage
    disabled: false     # Kết quả Google không CAPTCHA
  - name: wikipedia
    disabled: false
  - name: google news
    disabled: false
  - name: google scholar
    disabled: false
  - name: mojeek
    disabled: true
  - name: marginalia
    disabled: true
