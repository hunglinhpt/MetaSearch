# Prometheus alert rules for MetaSearch
groups:
  - name: metasearch
    rules:
      - alert: HighHTTPErrorRate
        expr: >
          100 * sum(rate(metasearch_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(metasearch_http_requests_total[5m])), 0.001) > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "HTTP 5xx rate above 5% for 5 minutes"
      - alert: SlowAnswers
        expr: >
          histogram_quantile(0.95, sum(rate(metasearch_http_request_duration_seconds_bucket{path="/answer"}[5m])) by (le)) > 15
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Answer p95 above 15s"
      - alert: EventLoopLag
        expr: >
          histogram_quantile(0.99, sum(rate(metasearch_event_loop_lag_seconds_bucket[5m])) by (le)) > 0.25
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Event loop p99 lag above 250ms"
      - alert: BreakerOpen
        expr: max(metasearch_breaker_state) by (engine) == 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Circuit breaker open for {{ $labels.engine }} over 10 minutes"
      - alert: PersistQueueBacklog
        expr: max(metasearch_background_queue_depth{queue="persist"}) > 500
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Persist queue above half its capacity (1000) for 5 minutes: the database is slow or stalled"
      - alert: PersistWritesDropped
        expr: increase(metasearch_persist_dropped_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Persist queue full: history writes are being dropped"
      - alert: PersistWritesFailing
        expr: increase(metasearch_persist_failed_total[15m]) > 10
        labels: {severity: warning}
        annotations:
          summary: "More than 10 persist writes failed in 15 minutes"
