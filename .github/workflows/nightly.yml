name: Nightly (integration, perf smoke, live smoke)

# Heavier checks that do not gate a merge: the full compose stack, a short load run on the
# bench harness, and a live search against real engines (report only).
on:
  schedule:
    - cron: "30 19 * * *"   # 02:30 Asia/Ho_Chi_Minh
  workflow_dispatch:

jobs:
  integration:
    name: Integration tests against the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compose environment
        working-directory: deploy
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "SEARXNG_SECRET=$(openssl rand -hex 16)"
          } >> .env
          # Keyless provider, so the answer test can reach a real LLM without secrets.
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=pollinations/' .env
          grep -c '^LLM_PROVIDER=pollinations$' .env
      - name: Start the stack
        working-directory: deploy
        run: |
          docker compose up -d api
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8000/readyz && exit 0
            sleep 5
          done
          echo "api did not become ready"; exit 1
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Integration tests
        working-directory: api
        env:
          METASEARCH_INTEGRATION: "1"
          METASEARCH_URL: http://127.0.0.1:8000
        # Auth is on in compose, so the tests need a key (admin, for the engine config test).
        # It lives only in this shell: through GITHUB_ENV it was printed in the next step's
        # env block. The stack, and the key with it, is removed at the end of the job.
        run: |
          uv sync --locked --extra dev
          KEY=$(cd ../deploy && docker compose exec -T api python -m app.cli keys create ci-nightly --role admin | awk '/^key:/{print $2}')
          [ -n "$KEY" ] || { echo "could not create an API key"; exit 1; }
          echo "::add-mask::$KEY"
          METASEARCH_API_KEY="$KEY" uv run --locked python -m pytest tests/integration -q -rs
      - name: Compose logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        working-directory: deploy
        run: docker compose down -v

  perf-smoke:
    name: Perf smoke on the bench harness (fake upstream)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Search scenario on the harness
        run: |
          # The venv's python, not `uv run`: servers left running under `uv run` hold the uv
          # cache lock, and setup-uv's cache prune then times out after the job.
          .venv/bin/python -m scripts.perf.upstream --port 18766 &
          UP=$!
          .venv/bin/python -m scripts.perf.server --profile memory --port 18765 --upstream-port 18766 &
          SRV=$!
          trap 'kill $SRV $UP' EXIT
          .venv/bin/python -m scripts.perf.load --profile memory --scenario search \
            --port 18765 --upstream-port 18766 --out perf-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: perf-smoke
          path: api/perf-smoke.json

  live-smoke:
    name: Live smoke against real engines (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run --locked python scripts/live_smoke.py

  quality-eval:
    name: Retrieval quality vs committed baselines (docs/36 S2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Report-only on hosted runners: their egress differs from the production
    # network the baselines were measured on (docs/36 S2). The gate is
    # authoritative when run from the production egress (docs/36 §14).
    continue-on-error: true
    defaults:
      run:
        working-directory: api
    env:
      SEARXNG_ENABLED: "false"
      DATABASE_URL: sqlite+aiosqlite:///./eval_ci.db
      REDIS_URL: ""
      LLM_PROVIDER: none
      SERVE_UI: "false"
      SCHEDULER_ENABLED: "false"
      ENGINE_QUARANTINE_ENABLED: "false"
      # docs/36 E2: baselines are a median of 2 cache-free runs.
      CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Eval both golden sets and gate against the baselines
        run: |
          .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8011 &
          SRV=$!
          trap 'kill $SRV' EXIT
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8011/v1/meta >/dev/null && break; sleep 1; done
          rc=0
          for pair in "golden_v2:eval_v2_golden_v2.lite.json" "golden_v3_vi:eval_v2_golden_v3_vi.lite.json"; do
            g="${pair%%:*}"; b="${pair##*:}"
            # eval_v2 exits 1 below its absolute targets (known, docs/36 F1): the gate decides.
            .venv/bin/python scripts/eval_v2.py --base-url http://127.0.0.1:8011 \
              --golden "evals/$g.json" --report-dir "evals/reports/$g" --concurrency 3 --repeat 2 || true
            latest=$(ls -t "evals/reports/$g"/eval_v2_*.json | head -1)
            .venv/bin/python scripts/eval_gate.py --baseline "evals/baselines/$b" --report "$latest" || rc=1
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-eval-reports
          path: api/evals/reports/
