name: CI Multi-Platform Matrix (Linux, Windows, macOS)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-matrix:
    name: Backend (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # installs the [mcp] extra too, so the MCP tools are tested with the real SDK
      - name: Install dependencies from the lockfile (dev + mcp extras)
        run: uv sync --locked --extra dev --extra mcp

      - name: Code Formatting Check (Ruff Format)
        run: uv run --locked python -m ruff format --check app tests scripts

      - name: Static Analysis & Linting (Ruff Check)
        run: uv run --locked python -m ruff check app tests scripts

      - name: Type check (mypy, app/core and app/api)
        run: uv run --locked python -m mypy

      - name: Security AST Audit (Bandit)
        run: uv run --locked python -m bandit -q -r app -x tests

      - name: Mandatory End-to-End (E2E) Full System Suite
        run: uv run --locked python -m pytest tests/test_e2e_full_system.py -q

      - name: Backend Full Test Suite with coverage floor
        run: uv run --locked python -m pytest tests -q --cov=app --cov-report=term --cov-fail-under=84

      - name: Dependency Audit (pip-audit)
        run: uv run --locked pip-audit --skip-editable

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rules-and-scripts:
    name: Alert rules (promtool) and Windows scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check Prometheus alert rules with promtool
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" --entrypoint promtool \
            prom/prometheus:v2.54.1 check rules /rules/alerts.yml

  windows-scripts:
    name: Windows scripts parse on PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Parse every scripts/windows/*.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { Write-Host "$($_.Name): $($errors.Count) parse errors"; $bad++ }
          }
          if ($bad -gt 0) { exit 1 }

  frontend-matrix:
    name: Frontend (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (vitest)
        run: npm run test

      - name: Dependency audit (npm audit, high and above)
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

      - name: Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Production Next.js Build
        run: npm run build

  release-pipeline-gate:
    name: Full Pipeline Gate (${{ matrix.os }})
    needs: [backend-matrix, frontend-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run Full Quality Gate & Pre-Flight Check (scripts/release.py --check)
        run: python scripts/release.py --check

  docker-build-smoke:
    name: Docker Container Build Smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: metasearch-api:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: metasearch-frontend:ci
