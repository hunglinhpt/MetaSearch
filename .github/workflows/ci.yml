name: CI Multi-Platform Matrix (Linux, Windows, macOS)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-matrix:
    name: Backend (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code Formatting Check (Ruff Format)
        run: python -m ruff format --check app tests scripts

      - name: Static Analysis & Linting (Ruff Check)
        run: python -m ruff check app tests scripts

      - name: Security AST Audit (Bandit)
        run: python -m bandit -q -r app -x tests

      - name: Mandatory End-to-End (E2E) Full System Suite
        run: python -m pytest tests/test_e2e_full_system.py -q

      - name: Backend Full Test Suite (Pytest)
        run: python -m pytest tests -q

      - name: Dependency Audit (pip-audit)
        continue-on-error: true
        run: pip-audit --skip-editable

  frontend-matrix:
    name: Frontend (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Production Next.js Build
        run: npm run build

  release-pipeline-gate:
    name: Full Pipeline Gate (${{ matrix.os }})
    needs: [backend-matrix, frontend-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Backend Dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run Full Quality Gate & Pre-Flight Check (scripts/release.py --check)
        run: python scripts/release.py --check

  docker-build-smoke:
    name: Docker Container Build Smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: metasearch-api:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: metasearch-frontend:ci
